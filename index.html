<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gwen Data: allow access</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@80..100,400..800&display=swap">
<style>
  :root { --desk:#f6f5f2; --strip:#fff; --ink:#1c1b19; --ink2:#55524c; --rule:#dedbd4; --accent:#2f5d50; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --desk:#161614; --strip:#1f1f1c; --ink:#f1efe9; --ink2:#b3afa6; --rule:#33322e; --accent:#7fb9a8; } }
  body { margin:0; font:400 15px/1.5 Archivo, sans-serif; background:var(--desk); color:var(--ink); display:grid; place-items:center; min-height:100vh; }
  main { background:var(--strip); border:1px solid var(--rule); border-radius:10px; padding:24px; width:min(420px, 92vw); }
  h1 { font:700 18px/1.3 Archivo, sans-serif; font-stretch:80%; margin:0 0 8px; }
  p { margin:0 0 16px; color:var(--ink2); }
  button { font:600 13.5px Archivo, sans-serif; padding:0 16px; border-radius:8px; border:1px solid var(--rule); background:var(--strip); color:var(--ink); cursor:pointer; height:34px; }
  button.go { background:var(--accent); border-color:var(--accent); color:var(--desk); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <h1 id="title">One moment</h1>
  <p id="msg"></p>
  <div class="row" id="buttons"></div>
</main>
<script type="module">
// Sign-in screen for Gwen Data. Supabase Auth sends people here, with an authorization_id, when a Claude
// connector asks to sign in. Settings come from config.js (public by design).
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.80.0';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const say = (title, msg) => { $('title').textContent = title; $('msg').textContent = msg; $('buttons').textContent = ''; };
const button = (label, onClick, cls = '') => {
  const b = Object.assign(document.createElement('button'), { textContent: label, className: cls });
  b.onclick = onClick;
  $('buttons').append(b);
};
// Always show Google's account picker, so people with more than one account choose which one signs in.
const signIn = () => supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href, queryParams: { prompt: 'select_account' } } });
const switchAccount = async () => { await supabase.auth.signOut({ scope: 'local' }); signIn(); };

const authorizationId = new URLSearchParams(location.search).get('authorization_id');

async function main() {
  if (!authorizationId) return say('Nothing to approve', 'Open Gwen Data from Claude to sign in.');
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    say('Sign in to continue', 'Use your company Google account, or a personal one your admin has added.');
    return button('Sign in with Google', signIn, 'go');
  }
  const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error || !data) {
    say('That did not work', 'This sign-in link may have expired. Open Gwen Data from Claude and try again.');
    return button('Use a different account', switchAccount);
  }
  const who = data.user?.email || session.user?.email || 'your account';
  // Already allowed before: Supabase gives the way back straight away. Say who is signed in, so a person
  // with two accounts can switch before going back.
  if (data.redirect_uri) {
    say('Continue to Claude?', `You are signed in as ${who}.`);
    button(`Continue as ${who}`, () => { location.href = data.redirect_uri; }, 'go');
    return button('Use a different account', switchAccount);
  }
  say('Allow Gwen Data?', `${data.client?.client_name || data.client?.name || 'Claude'} wants to read and keep your Gwen history as ${who}. You can stop this at any time.`);
  const finish = async (call) => {
    const { data: done, error: err } = await call(authorizationId);
    if (err || !done?.redirect_url) {
      say('That did not work', 'Open Gwen Data from Claude and try again.');
      return button('Use a different account', switchAccount);
    }
    location.href = done.redirect_url;
  };
  button('Allow', () => finish((id) => supabase.auth.oauth.approveAuthorization(id, { skipBrowserRedirect: true })), 'go');
  button('Cancel', () => finish((id) => supabase.auth.oauth.denyAuthorization(id, { skipBrowserRedirect: true })));
  button('Use a different account', switchAccount);
}
main();
</script>
</body>
</html>
